<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>随风 Club (sf-club) - 现代开发者备战与高频面试真题平台</title>
  <meta name="description" content="基于微服务架构的高保真开发者刷题与智能备战平台，覆盖题库大全、分类标签筛选、在线考场、技术圈子与 AI 模拟面试。" />
  <link rel="icon" href="data:image/svg+xml,&lt;svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'&gt;&lt;circle cx='50' cy='50' r='48' fill='%23faad14'/&gt;&lt;circle cx='38' cy='42' r='7' fill='%231e293b'/&gt;&lt;circle cx='40' cy='40' r='2.5' fill='%23fff'/&gt;&lt;path d='M48 52 Q68 56 62 68 Q52 74 42 66 Z' fill='%23ff7a45'/&gt;&lt;/svg&gt;" />
  <script>
    (function () {
      try {
        const saved = localStorage.getItem('sf_theme')
        const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches
        if (saved === 'dark' || (!saved && prefersDark)) {
          document.documentElement.classList.add('dark')
        }
      } catch (e) {}
    })()
  </script>
</head>
<body>
  <div id="app"></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
